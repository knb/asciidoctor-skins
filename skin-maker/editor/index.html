<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asciidoctor Skin Maker</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <div id="file-protocol-banner" class="file-banner hidden" role="alert"></div>
  <div id="compile-api-banner" class="file-banner hidden" role="status"></div>
  <header class="app-header">
    <div>
      <h1>Asciidoctor Skin Maker</h1>
      <p id="app-subtitle" class="subtitle"></p>
    </div>
    <div class="header-actions">
      <label class="locale-picker">
        <span id="locale-label"></span>
        <select id="locale-select" aria-label="Language">
          <option value="en">English</option>
          <option value="ja">日本語</option>
        </select>
      </label>
      <button type="button" id="btn-reset"></button>
      <button type="button" id="btn-export-yaml" class="primary"></button>
      <button type="button" id="btn-export-css-file" class="secondary" disabled></button>
      <button type="button" id="btn-export-css" class="secondary"></button>
    </div>
  </header>

  <main class="app-main">
    <aside class="panel controls">
      <div id="settings-container"></div>

      <details class="settings-group commands" open>
        <summary id="build-summary"></summary>
        <div class="settings-body">
          <pre id="build-instructions"></pre>
        </div>
      </details>
    </aside>

    <section class="panel preview">
      <div class="preview-toolbar">
        <label class="preview-doc-picker">
          <span id="preview-doc-label"></span>
          <select id="preview-doc-select"></select>
        </label>
        <label class="preview-inspect-toggle">
          <input type="checkbox" id="source-inspect-toggle">
          <span id="source-inspect-label"></span>
        </label>
        <span><span id="preview-file-label"></span> <code id="preview-path">index2.html</code></span>
        <a id="open-preview" href="../index2.html" target="_blank" rel="noopener"></a>
      </div>
      <div class="preview-body">
        <iframe id="preview-frame" title="Skin preview"></iframe>
        <aside id="preview-source-panel" class="preview-source hidden" aria-live="polite">
          <div class="preview-source-toolbar">
            <div class="preview-source-meta">
              <strong id="source-kind"></strong>
              <span id="source-location"></span>
            </div>
            <div class="preview-source-actions">
              <a id="source-open-adoc" href="#" target="_blank" rel="noopener"></a>
              <button type="button" id="source-copy" class="secondary"></button>
            </div>
          </div>
          <pre id="source-content"></pre>
        </aside>
      </div>
    </section>
  </main>

  <script src="i18n.js"></script>
  <script src="manifest.js"></script>
  <script src="app.js"></script>
</body>
</html>
